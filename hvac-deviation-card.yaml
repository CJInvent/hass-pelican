square: false
type: grid
title: Business-hours deviation — weekly mode (top), last 8 weeks
columns: 3
grid_options:
  columns: full
cards:
  - type: custom:apexcharts-card
    header:
      show: true
      title: Sales
      show_states: true
      colorize_states: true
    graph_span: 8w
    span:
      end: week
    update_interval: 15min
    yaxis:
      - decimals: 1
        min: "~-5"
        max: "~5"
    card_mod:
      style: |
        ha-card { container-type: inline-size; }
        .wrapper { grid-template-columns: minmax(0, 1fr) !important; }
        #graph-wrapper, #graph { min-width: 0 !important; max-width: 100% !important; }
        #header { padding: 8px 10px 0 !important; }
        #header__states { flex-wrap: nowrap !important; gap: 4px; margin: 0 !important; }
        #header__states > * { margin: 0 !important; }
        #states__state { flex: 1 1 0 !important; min-width: 0 !important; overflow: hidden; }
        #state__value > #state { font-size: clamp(12px, 6.5cqw, 25px) !important; }
        #state__value > #uom { font-size: clamp(8px, 3.2cqw, 14px) !important; }
        #state__name { font-size: clamp(8px, 3.4cqw, 11px) !important; }
    apex_config:
      chart:
        height: 280
        stacked: true
        animations:
          enabled: false
      legend:
        show: false
      plotOptions:
        bar:
          columnWidth: 55%
      fill:
        opacity: [0.85, 0.85, 1]
      markers:
        size: 0
        hover:
          size: 3
      dataLabels:
        enabled: false
      tooltip:
        shared: true
        intersect: false
        theme: dark
        custom: |
          EVAL:function(o){
            var w = o.w, i = o.dataPointIndex;
            var d = new Date(w.globals.seriesX[0][i]);
            var html = '<div style="padding:8px 10px;font-size:12px">' +
              '<div style="margin-bottom:6px;font-weight:600">Week of ' +
              d.toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) + '</div>';
            w.globals.seriesNames.forEach(function(n, k){
              var v = o.series[k] ? o.series[k][i] : null;
              html += '<div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:' +
                w.globals.colors[k] + '"></span>' + n + ': <b>' +
                (v == null ? '\u2013' : Number(v).toFixed(1) + '\u00b0') + '</b></div>';
            });
            return html + '</div>';
          }
      xaxis:
        type: datetime
        labels:
          datetimeUTC: false
          format: dd MMM
    series:
      - entity: sensor.hvac_deviation_sales
        name: Max below
        color: "#1e88e5"
        type: column
        stroke_width: 0
        show:
          in_header: false
        float_precision: 1
        data_generator: |
          const ID = "sensor.hvac_deviation_sales";
          const now = new Date(), cur = new Date(now);
          cur.setHours(0, 0, 0, 0); cur.setDate(cur.getDate() - cur.getDay());
          const first = new Date(cur); first.setDate(first.getDate() - 49);
          const h = await hass.callApi("GET", "history/period/" + encodeURIComponent(first.toISOString()) +
            "?end_time=" + encodeURIComponent(now.toISOString()) + "&filter_entity_id=" + ID +
            "&significant_changes_only=0");
          const pts = (h?.[0] || [])
            .map(r => ({ t: new Date(r.last_updated).getTime(), v: parseFloat(r.state) }))
            .filter(r => Number.isFinite(r.t)).sort((a, b) => a.t - b.t);
          const out = [];
          for (let w = 7; w >= 0; w--) {
            const ws = new Date(cur); ws.setDate(ws.getDate() - w * 7);
            const we = new Date(ws); we.setDate(we.getDate() + 7);
            const s = ws.getTime(), e = Math.min(we.getTime(), now.getTime());
            let lo = 0, hi = 0; const g = [];
            for (let i = 0; i < pts.length; i++) {
              const f = Math.max(pts[i].t, s);
              const t = Math.min(i + 1 < pts.length ? pts[i + 1].t : now.getTime(), e);
              const v = pts[i].v;
              if (t > f && Number.isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); if (v !== 0) g.push([v, t - f]); }
            }
            const BIN = 0.1;
            const bins = {};
            for (const x of g) { const k = Math.round(x[0] / BIN); bins[k] = (bins[k] || 0) + x[1]; }
            let m = 0, best = 0;
            for (const k in bins) {
              const kv = Number(k) * BIN;
              if (bins[k] > best || (bins[k] === best && Math.abs(kv) > Math.abs(m))) { best = bins[k]; m = kv; }
            }
            out.push([s, +(({lo: lo, hi: hi, m: m})["lo"]).toFixed(2)]);
          }
          return out;
