blueprint:
  name: Pelican – rotate units toward occupancy schedules
  description: >-
    Every 5 minutes, runs at most a set number of thermostats and holds every
    other online unit Off. A unit given a slot is driven to actually run: put in
    cool or heat with its setpoint pushed past the room temperature, so the
    compressor runs for as long as it holds the slot, until the room is a margin
    inside its schedule's band. Slots are filled in priority order: cooling
    overrides (highest priority first), then manual on-demand requests, then
    units inside their minimum run time, then the rooms furthest from their
    goal. When something higher-priority needs a slot and none are free, the
    unit that has been running longest is turned off. Offline thermostats are
    ignored.


    Add as many schedules as you need, each either a YAML table of start times
    and setpoints or a Schedule helper edited on HA's graphical weekly calendar.


    Written for the Pelican Wireless integration
    (https://github.com/CJInvent/hass-pelican). Manual detection and keypad
    locking rely on its "Set by" sensor and "Keypad unlocked" switch. Turn off any
    schedules running on the thermostats themselves first, or they will overwrite
    these setpoints.
  domain: automation
  source_url: https://github.com/CJInvent/hass-pelican/blob/main/blueprints/automation/pelican/rotate_units.yaml
  input:
    schedules_section:
      name: Schedules
      icon: mdi:calendar-clock
      description: >-
        One entry per schedule, each defined one of two ways. A setpoints table
        (YAML): `weekday:` and `weekend:` maps of start time to [heat, cool], for
        example `"08:00": [68, 75]`. Add `mon:` … `sun:` for a day that differs;
        each entry holds until the next, overnight included. Or a Schedule helper,
        drawn on its graphical weekly calendar, with `heat: 68` and `cool: 75`
        under each block's More options → Additional data, and the setpoints
        below for outside its blocks. A table wins if both are given. A
        thermostat listed under two schedules follows the first one.
      input:
        zones:
          name: Schedules
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              fields:
                name:
                  label: Name
                  required: true
                  selector: {text: {}}
                thermostats:
                  label: Thermostats
                  required: true
                  selector: {entity: {multiple: true, filter: [{domain: climate}]}}
                setpoints:
                  label: Setpoints table (YAML)
                  selector: {object: {}}
                schedule:
                  label: Or a Schedule helper
                  selector: {entity: {filter: [{domain: schedule}]}}
                unoccupied_heat:
                  label: Heat setpoint outside helper blocks
                  selector: {number: {min: 40, max: 90, unit_of_measurement: "°", mode: box}}
                unoccupied_cool:
                  label: Cool setpoint outside helper blocks
                  selector: {number: {min: 40, max: 90, unit_of_measurement: "°", mode: box}}
    limits_section:
      name: Unit limits and cycling
      icon: mdi:fan
      input:
        max_running:
          name: Maximum units running
          description: Active cooling overrides can raise this by their offsets.
          default: 2
          selector: {number: {min: 0, max: 100, mode: box}}
        run_margin:
          name: Run margin
          description: >-
            A unit with a slot keeps running until its room is this far inside its
            schedule's band: below the cool setpoint by this much, or above the
            heat setpoint. Rooms are ranked by how far they are from that goal.
          default: 1.0
          selector: {number: {min: 0, max: 5, step: 0.5, unit_of_measurement: "°", mode: box}}
        call_margin:
          name: Call margin
          description: >-
            How far past the goal the thermostat setpoint is written, so the unit
            calls for cooling or heating the whole time it holds a slot instead of
            idling at its own setpoint. Clamped to the thermostat's limits.
          default: 2
          selector: {number: {min: 1, max: 10, step: 1, unit_of_measurement: "°", mode: box}}
        second_unit_min_error:
          name: Minimum error for additional units
          description: >-
            The first schedule-driven unit runs whenever its room is past the goal
            at all. Each additional one must be at least this far past it. 0 keeps
            every slot in use while any room needs it.
          default: 0
          selector: {number: {min: 0, max: 10, step: 0.1, unit_of_measurement: "°", mode: box}}
        min_run_minutes:
          name: Minimum run time
          description: >-
            A unit turned on stays on at least this long, so it can't be cycled
            off after a single short run. Cooling overrides and manual requests
            can still displace it. 0 disables.
          default: 30
          selector: {number: {min: 0, max: 240, step: 5, unit_of_measurement: min, mode: box}}
        min_off_minutes:
          name: Minimum off time
          description: >-
            A unit turned off waits at least this long before it can be given a
            slot again, so it can't flap off and straight back on. Cooling
            overrides and manual requests ignore this. 0 disables.
          default: 10
          selector: {number: {min: 0, max: 120, step: 5, unit_of_measurement: min, mode: box}}
    manual_section:
      name: Manual on-demand
      icon: mdi:hand-back-right
      input:
        manual_minutes:
          name: Manual override duration
          description: >-
            When someone changes a thermostat at the unit itself, it is left
            exactly as they set it for this long and takes a slot ahead of
            schedule-driven units. Then it returns to schedule. 0 disables.
          default: 60
          selector: {number: {min: 0, max: 480, step: 5, unit_of_measurement: min, mode: box}}
        lock_keypads:
          name: Keep these keypads locked
          description: >-
            Their keypads are locked again on every run. A locked thermostat
            can't be adjusted at the unit, so it never enters manual override.
          default: []
          selector: {entity: {multiple: true, filter: [{domain: climate}]}}
    overrides_section:
      name: Cooling overrides
      icon: mdi:snowflake-alert
      collapsed: true
      description: >-
        While an override's trigger entity is on, its thermostats cool to the
        override setpoint and take slots ahead of everything else, highest
        priority first. The unit-limit offsets of all active overrides stack. A
        thermostat in several active overrides follows the highest-priority one.
      input:
        overrides:
          name: Overrides
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              description_field: switch
              fields:
                name:
                  label: Name
                  required: true
                  selector: {text: {}}
                switch:
                  label: Trigger entity (active while on)
                  required: true
                  selector: {entity: {filter: [{domain: [input_boolean, switch, binary_sensor]}]}}
                thermostats:
                  label: Thermostats to cool
                  required: true
                  selector: {entity: {multiple: true, filter: [{domain: climate}]}}
                cool_target:
                  label: Cooling setpoint
                  required: true
                  selector: {number: {min: 40, max: 90, unit_of_measurement: "°", mode: box}}
                priority:
                  label: Priority (higher is more critical, default 0)
                  selector: {number: {min: 0, max: 100, mode: box}}
                unit_offset:
                  label: Unit limit offset while active (default 0)
                  selector: {number: {min: -20, max: 20, mode: box}}

mode: queued
max: 2
max_exceeded: silent

# Plain input values, available to the template triggers and the actions.
trigger_variables:
  zones: !input zones
  overrides: !input overrides
  manual_minutes: !input manual_minutes

triggers:
  - trigger: time_pattern
    minutes: "/5"
  - trigger: homeassistant
    event: start
  # A template trigger only fires on a false -> true transition, so both of these
  # are true for the minute after the event they detect.
  # Any override turning on or off:
  - trigger: template
    value_template: >-
      {% set ids = overrides | map(attribute='switch') | select | list %}
      {{ ids | count > 0 and expand(ids)
         | selectattr('last_changed', 'gt', now() - timedelta(seconds=60))
         | list | count > 0 }}
  # A manual change at a unit, or a manual override expiring:
  - trigger: template
    value_template: >-
      {% set ns = namespace(ids=[], hit=false) %}
      {% for z in zones %}{% set ns.ids = ns.ids + ([z.thermostats] if z.thermostats is string else (z.thermostats or [])) %}{% endfor %}
      {% for o in overrides %}{% set ns.ids = ns.ids + ([o.thermostats] if o.thermostats is string else (o.thermostats or [])) %}{% endfor %}
      {% if manual_minutes | int(0) > 0 %}
        {% for e in ns.ids | unique %}
          {% set sb = device_entities(device_id(e) or '') | select('match', 'sensor[.].*_set_by$') | first %}
          {% if sb and is_state(sb, 'Station') %}
            {% set age = (now() - (expand(sb) | first).last_changed).total_seconds() %}
            {% set end = manual_minutes | int * 60 %}
            {% if age < 60 or (age >= end and age < end + 60) %}{% set ns.hit = true %}{% endif %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ ns.hit }}

variables:
  max_running: !input max_running
  min_error: !input second_unit_min_error
  run_margin: !input run_margin
  call_margin: !input call_margin
  min_run_minutes: !input min_run_minutes
  min_off_minutes: !input min_off_minutes
  lock_keypads: !input lock_keypads

  # thermostat -> index of the first schedule that lists it.
  assignment: >-
    {% set ns = namespace(m={}) %}
    {% for z in zones %}
      {% set zi = loop.index0 %}
      {% for e in ([z.thermostats] if z.thermostats is string else (z.thermostats or [])) %}
        {% if e not in ns.m %}{% set ns.m = dict(ns.m, **{e: zi}) %}{% endif %}
      {% endfor %}
    {% endfor %}
    {{ ns.m }}

  # Everything this automation controls: scheduled thermostats plus any that
  # only appear in an override.
  managed: >-
    {% set ns = namespace(out=assignment | list) %}
    {% for o in overrides %}
      {% for e in ([o.thermostats] if o.thermostats is string else (o.thermostats or [])) %}
        {% if e not in ns.out %}{% set ns.out = ns.out + [e] %}{% endif %}
      {% endfor %}
    {% endfor %}
    {{ ns.out }}

  online: >-
    {% set ns = namespace(out=[]) %}
    {% for e in managed %}
      {% if states(e) not in ['unavailable', 'unknown']
            and state_attr(e, 'current_temperature') is number %}
        {% set ns.out = ns.out + [e] %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}

  # thermostat -> minutes its hvac mode has been something other than Off. A
  # climate entity's last_changed only moves when its mode changes.
  runtime: >-
    {% set ns = namespace(m={}) %}
    {% for e in online if not is_state(e, 'off') %}
      {% set ns.m = dict(ns.m, **{e: ((now() - (expand(e) | first).last_changed).total_seconds() / 60) | round(1)}) %}
    {% endfor %}
    {{ ns.m }}

  # thermostat -> minutes since someone changed it at the unit, while that is
  # still inside the manual window. Our own writes set "Set by" to Remote, so a
  # Station value is a person at the keypad.
  manual: >-
    {% set ns = namespace(m={}) %}
    {% if manual_minutes | int(0) > 0 %}
      {% for e in online %}
        {% set sb = device_entities(device_id(e) or '') | select('match', 'sensor[.].*_set_by$') | first %}
        {% if sb and is_state(sb, 'Station') %}
          {% set age = (now() - (expand(sb) | first).last_changed).total_seconds() / 60 %}
          {% if age < manual_minutes | int %}{% set ns.m = dict(ns.m, **{e: age | round(1)}) %}{% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {{ ns.m }}

  # thermostat -> {heat, cool} in effect right now. From the schedule's setpoints
  # table when it has one: that day's entries (mon..sun, else weekday/weekend),
  # the latest start at or before now, or yesterday's last entry before today's
  # first. Otherwise from its Schedule helper: the active block's data, or the
  # outside-block setpoints. A thermostat with neither gets no target.
  targets: >-
    {% set days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] %}
    {% set wd = now().weekday() %}
    {% set yd = (wd - 1) % 7 %}
    {% set hm = now().strftime('%H:%M') %}
    {% set ns = namespace(out={}) %}
    {% for e, zi in assignment.items() %}
      {% set z = zones[zi] %}
      {% set sp = z.get('setpoints') %}
      {% set pick = namespace(t='', band=none) %}
      {% if sp is mapping %}
        {% set today = sp.get(days[wd]) or sp.get('weekend' if wd >= 5 else 'weekday') or {} %}
        {% for k, v in today.items() if k is string and ':' in k %}
          {% set kk = '%02d:%s' | format(k.split(':')[0] | int, k.split(':')[1][:2]) %}
          {% if kk <= hm and kk >= pick.t %}{% set pick.t = kk %}{% set pick.band = v %}{% endif %}
        {% endfor %}
        {% if pick.band is none %}
          {% set yest = sp.get(days[yd]) or sp.get('weekend' if yd >= 5 else 'weekday') or {} %}
          {% for k, v in yest.items() if k is string and ':' in k %}
            {% set kk = '%02d:%s' | format(k.split(':')[0] | int, k.split(':')[1][:2]) %}
            {% if kk >= pick.t %}{% set pick.t = kk %}{% set pick.band = v %}{% endif %}
          {% endfor %}
        {% endif %}
      {% elif z.get('schedule') %}
        {% set h = state_attr(z.schedule, 'heat') | float(none) %}
        {% set c = state_attr(z.schedule, 'cool') | float(none) %}
        {% if is_state(z.schedule, 'on') and h is number and c is number %}
          {% set pick.band = [h, c] %}
        {% elif z.get('unoccupied_heat') is not none and z.get('unoccupied_cool') is not none %}
          {% set pick.band = [z.unoccupied_heat, z.unoccupied_cool] %}
        {% endif %}
      {% endif %}
      {% if pick.band is not none and pick.band | count == 2 %}
        {% set ns.out = dict(ns.out, **{e: {'heat': pick.band[0] | float, 'cool': pick.band[1] | float}}) %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}

  # Rooms that need a unit, as thermostat -> {mode, error, setpoint}. The goal is
  # run_margin inside the band; error is how far the room is past it. The written
  # setpoint is call_margin beyond the goal, so a unit holding a slot keeps
  # calling until we take the slot back. Clamping to the thermostat's limits
  # happens when it is written, since those limits depend on its current mode.
  demand: >-
    {% set ns = namespace(m={}) %}
    {% for e in online if e in targets %}
      {% set t = state_attr(e, 'current_temperature') | float %}
      {% set cool_goal = targets[e].cool - run_margin | float %}
      {% set heat_goal = targets[e].heat + run_margin | float %}
      {% if t > cool_goal and t - cool_goal >= heat_goal - t %}
        {% set ns.m = dict(ns.m, **{e: {'mode': 'cool', 'error': (t - cool_goal) | round(2),
            'setpoint': ((cool_goal - call_margin | float) | round(0, 'floor')) | int}}) %}
      {% elif t < heat_goal %}
        {% set ns.m = dict(ns.m, **{e: {'mode': 'heat', 'error': (heat_goal - t) | round(2),
            'setpoint': ((heat_goal + call_margin | float) | round(0, 'ceil')) | int}}) %}
      {% endif %}
    {% endfor %}
    {{ ns.m }}

  # Thermostats with demand, furthest from their goal first.
  ranked: >-
    {% set ns = namespace(rows=[]) %}
    {% for e, d in demand.items() %}{% set ns.rows = ns.rows + [{'entity': e, 'error': d.error}] %}{% endfor %}
    {{ ns.rows | sort(attribute='error', reverse=true) | map(attribute='entity') | list }}

  # thermostat -> minutes since it was turned Off, while inside min_off_minutes.
  resting: >-
    {% set ns = namespace(m={}) %}
    {% for e in online if is_state(e, 'off') %}
      {% set mins = (now() - (expand(e) | first).last_changed).total_seconds() / 60 %}
      {% if mins < min_off_minutes | float %}{% set ns.m = dict(ns.m, **{e: mins | round(1)}) %}{% endif %}
    {% endfor %}
    {{ ns.m }}

  # Active overrides, as thermostat -> {priority, target}. A thermostat in several
  # follows the highest priority; equal priorities take the lowest setpoint.
  forced: >-
    {% set ns = namespace(m={}) %}
    {% for o in overrides if o.switch and is_state(o.switch, 'on') %}
      {% set p = o.get('priority', 0) | float(0) %}
      {% set t = o.cool_target | float %}
      {% for e in ([o.thermostats] if o.thermostats is string else (o.thermostats or [])) if e in online %}
        {% set cur = ns.m.get(e) %}
        {% if not cur or p > cur.priority or (p == cur.priority and t < cur.target) %}
          {% set ns.m = dict(ns.m, **{e: {'priority': p, 'target': t}}) %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {{ ns.m }}

  # Base maximum plus the stacked offsets of every active override.
  limit: >-
    {% set ns = namespace(offset=0) %}
    {% for o in overrides if o.switch and is_state(o.switch, 'on') %}
      {% set ns.offset = ns.offset + (o.get('unit_offset', 0) | int(0)) %}
    {% endfor %}
    {{ [max_running | int + ns.offset, 0] | max }}

  # Slot order: overrides by priority, then manual requests (earliest first),
  # then running units. If the running units no longer fit, the ones running
  # longest go first; otherwise units inside their minimum run time stay, and the
  # rest compete with idle units by how far their rooms are from the goal. Units
  # still inside their minimum off time wait.
  selected: >-
    {% set ns = namespace(picks=[]) %}
    {% set by_priority = forced.items() | sort(attribute='1.priority', reverse=true) | list %}
    {% for e, f in by_priority %}
      {% if ns.picks | count < limit %}{% set ns.picks = ns.picks + [e] %}{% endif %}
    {% endfor %}
    {% for e, age in manual.items() | sort(attribute='1', reverse=true) | list %}
      {% if e not in ns.picks and not is_state(e, 'off') and ns.picks | count < limit %}
        {% set ns.picks = ns.picks + [e] %}
      {% endif %}
    {% endfor %}
    {% set ns2 = namespace(inc=[]) %}
    {% for e, mins in runtime.items() | sort(attribute='1') | list %}
      {% if e in targets and e not in ns.picks and e not in manual %}
        {% set ns2.inc = ns2.inc + [e] %}
      {% endif %}
    {% endfor %}
    {% set room = limit - ns.picks | count %}
    {% if ns2.inc | count > room %}
      {% set ns.picks = ns.picks + ns2.inc[:[room, 0] | max] %}
    {% else %}
      {% for e in ns2.inc if runtime[e] < min_run_minutes | float %}
        {% set ns.picks = ns.picks + [e] %}
      {% endfor %}
      {% for e in ranked %}
        {% if e not in ns.picks and e not in manual and e not in forced and e not in resting
              and ns.picks | count < limit
              and (not ns.picks or demand[e].error >= min_error | float) %}
          {% set ns.picks = ns.picks + [e] %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {{ ns.picks }}

actions:
  # 1) Everything not selected goes Off first, so the limit is never exceeded.
  #    A manual unit that is still Off is simply left alone by the Off check.
  - repeat:
      for_each: "{{ online | reject('in', selected) | list }}"
      sequence:
        - if:
            - "{{ not is_state(repeat.item, 'off') }}"
          then:
            - action: climate.set_hvac_mode
              continue_on_error: true
              target: {entity_id: "{{ repeat.item }}"}
              data: {hvac_mode: "off"}

  # 2) Selected units are driven so they actually run: overrides to their cooling
  #    setpoint, everything else to cool or heat with the setpoint pushed past the
  #    room. Only what differs is written. Manual units are left as the person set
  #    them, and a unit kept only by its minimum run time is left running as is.
  - repeat:
      for_each: >-
        {{ selected | reject('in', manual)
           | select('in', (forced | list) + (demand | list)) | list }}
      sequence:
        - variables:
            override_unit: "{{ repeat.item in forced }}"
            want_mode: "{{ 'cool' if override_unit else demand[repeat.item].mode }}"
            want_temp: "{{ forced[repeat.item].target if override_unit else demand[repeat.item].setpoint }}"
        # Mode first: the setpoint limits depend on it.
        - if:
            - "{{ not is_state(repeat.item, want_mode) }}"
          then:
            - action: climate.set_hvac_mode
              continue_on_error: true
              target: {entity_id: "{{ repeat.item }}"}
              data: {hvac_mode: "{{ want_mode }}"}
        - variables:
            write_temp: >-
              {% set lo = state_attr(repeat.item, 'min_temp') | float(want_temp) %}
              {% set hi = state_attr(repeat.item, 'max_temp') | float(want_temp) %}
              {{ ([[want_temp | float, lo] | max, hi] | min) | int }}
        - if:
            - "{{ state_attr(repeat.item, 'temperature') | float(0) != write_temp | float }}"
          then:
            - action: climate.set_temperature
              continue_on_error: true
              target: {entity_id: "{{ repeat.item }}"}
              data: {temperature: "{{ write_temp }}"}

  # 3) Re-lock keypads every run. Skipped for units in a manual window, because
  #    writing to them would end the override.
  - repeat:
      for_each: >-
        {% set ns = namespace(out=[]) %}
        {% for e in lock_keypads if e in online and e not in manual %}
          {% set sw = device_entities(device_id(e) or '') | select('match', 'switch[.].*_keypad_unlocked$') | first %}
          {% if sw %}{% set ns.out = ns.out + [sw] %}{% endif %}
        {% endfor %}
        {{ ns.out }}
      sequence:
        - action: switch.turn_off
          continue_on_error: true
          target: {entity_id: "{{ repeat.item }}"}

  # 4) A rejected write is otherwise invisible. Say so, and clear it once fixed.
  - variables:
      misses: >-
        {% set ns = namespace(out=[]) %}
        {% for e in selected | reject('in', manual) | select('in', (forced | list) + (demand | list)) %}
          {% set mode = 'cool' if e in forced else demand[e].mode %}
          {% set want = forced[e].target if e in forced else demand[e].setpoint %}
          {% set lo = state_attr(e, 'min_temp') | float(want) %}
          {% set hi = state_attr(e, 'max_temp') | float(want) %}
          {% set expect = ([[want | float, lo] | max, hi] | min) | int %}
          {% if not is_state(e, mode) or state_attr(e, 'temperature') | float(0) != expect %}
            {% set ns.out = ns.out + [state_attr(e, 'friendly_name') ~ ' (wanted ' ~ mode ~ ' '
                ~ expect ~ ', allowed ' ~ state_attr(e, 'min_temp') ~ '–' ~ state_attr(e, 'max_temp') ~ ')'] %}
          {% endif %}
        {% endfor %}
        {{ ns.out }}
  - if:
      - "{{ misses | count > 0 }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: pelican_unit_rotation
          title: Thermostat setpoints not applied
          message: >-
            Given a slot, but not in the mode and setpoint written to them,
            usually because a write failed or the thermostat is refusing changes:
            {{ misses | join(', ') }}
    else:
      - action: persistent_notification.dismiss
        data: {notification_id: pelican_unit_rotation}

  # 5) Publish this run's inputs for dashboards and statistics. Every online
  #    scheduled thermostat, running or not, with the schedule targets in effect.
  - event: pelican_unit_rotation
    event_data:
      selected: "{{ selected }}"
      manual: "{{ manual | list }}"
      forced: "{{ forced | list }}"
      thermostats: >-
        {% set ns = namespace(out={}) %}
        {% for e in online if e in targets %}
          {% set ns.out = dict(ns.out, **{e: {
              'temperature': state_attr(e, 'current_temperature') | float,
              'heat': targets[e].heat,
              'cool': targets[e].cool}}) %}
        {% endfor %}
        {{ ns.out }}
