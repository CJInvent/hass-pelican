square: false
type: grid
title: HVAC runtime — last 7 weeks + current
columns: 3
grid_options:
  columns: full
cards:
  - type: custom:apexcharts-card
    header:
      show: true
      title: Sales
      show_states: true
      colorize_states: true
    graph_span: 8w
    span:
      end: week
    update_interval: 15min
    all_series_config:
      type: column
      float_precision: 2
      unit: h
      show:
        legend_value: false
        datalabels: false
    card_mod:
      style: |
        ha-card { container-type: inline-size; }
        .wrapper { grid-template-columns: minmax(0, 1fr) !important; }
        #graph-wrapper, #graph { min-width: 0 !important; max-width: 100% !important; }
        #header { padding: 8px 10px 0 !important; }
        #header__states { flex-wrap: nowrap !important; gap: 4px; margin: 0 !important; }
        #header__states > * { margin: 0 !important; }
        #states__state { flex: 1 1 0 !important; min-width: 0 !important; overflow: hidden; text-align: center; }
        #state__value { display: block !important; text-align: center; }
        #state__value > #state { font-size: clamp(16px, 10cqw, 34px) !important; }
        #state__value > #uom { font-size: clamp(10px, 3.8cqw, 16px) !important; }
        #state__name { font-size: clamp(10px, 3.8cqw, 13px) !important; }
    apex_config:
      chart:
        height: 280
        stacked: true
        animations:
          enabled: false
      plotOptions:
        bar:
          columnWidth: 60%
      markers:
        size: 0
        hover:
          size: 3
      xaxis:
        type: datetime
        labels:
          datetimeUTC: false
          format: MMM d
      yaxis:
        min: 0
        title:
          text: Runtime (hours)
      tooltip:
        shared: true
        intersect: false
        theme: dark
        custom: |
          EVAL:function(o){
            var w = o.w, i = o.dataPointIndex;
            var d = new Date(w.globals.seriesX[0][i]);
            var html = '<div style="padding:8px 10px;font-size:12px">' +
              '<div style="margin-bottom:6px;font-weight:600">Week of ' +
              d.toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) + '</div>';
            w.globals.seriesNames.forEach(function(n, k){
              var v = o.series[k] ? o.series[k][i] : null;
              html += '<div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:' +
                w.globals.colors[k] + '"></span>' + n + ': <b>' +
                (v == null ? '\u2013' : Number(v).toFixed(2) + ' h') + '</b></div>';
            });
            return html + '</div>';
          }
      legend:
        show: false
      dataLabels:
        enabled: false
    series:
      - entity: climate.sales
        name: Heat
        color: "#ef5350"
        type: column
        stroke_width: 0
        show:
          in_header: false
          legend_value: true
        data_generator: |

          const ID = "climate.sales", MATCH = a => a === "heating";
          const now = new Date(), cur = new Date(now);
          cur.setHours(0, 0, 0, 0); cur.setDate(cur.getDate() - cur.getDay());
          const first = new Date(cur); first.setDate(first.getDate() - 49);
          const hist = await hass.callApi("GET", "history/period/" + encodeURIComponent(first.toISOString()) +
            "?end_time=" + encodeURIComponent(now.toISOString()) + "&filter_entity_id=" + ID +
            "&significant_changes_only=0");
          const pts = (hist?.[0] || [])
            .map(r => ({ t: new Date(r.last_updated).getTime(), a: r.attributes?.hvac_action }))
            .filter(r => Number.isFinite(r.t)).sort((x, y) => x.t - y.t);
          const out = [];
          for (let w = 7; w >= 0; w--) {
            const ws = new Date(cur); ws.setDate(ws.getDate() - w * 7);
            const we = new Date(ws); we.setDate(we.getDate() + 7);
            const s = ws.getTime(), e = Math.min(we.getTime(), now.getTime());
            let h = 0;
            for (let i = 0; i < pts.length; i++) {
              const f = Math.max(pts[i].t, s);
              const t = Math.min(i + 1 < pts.length ? pts[i + 1].t : now.getTime(), e);
              if (MATCH(pts[i].a) && t > f) h += (t - f) / 3600000;
            }
            out.push([s, Number(h.toFixed(2))]);
          }
          return out;
