        show:
          in_header: false
          legend_value: true
        data_generator: |

          const ID = "climate.bruce_break_room", MATCH = a => a === "heating";
          const now = new Date(), cur = new Date(now);
          cur.setHours(0, 0, 0, 0); cur.setDate(cur.getDate() - cur.getDay());
          const first = new Date(cur); first.setDate(first.getDate() - 49);
          const hist = await hass.callApi("GET", "history/period/" + encodeURIComponent(first.toISOString()) +
